<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --paper:#080808;
    --paper-2:rgba(255,255,255,0.06);
    --ink:#f0f0f0;
    --ink-soft:#BFBDC6;
    --ink-faint:rgba(255,255,255,0.44);
    --line:rgba(255,255,255,0.07);
    --line-strong:rgba(255,255,255,0.16);
    --green:#30d158;
    --green-deep:#30d158;
    --green-pale:rgba(48,209,88,0.12);
    --red:#ff375f;
    --red-pale:rgba(255,55,95,0.1);
    --amber:#FFB454;
    --amber-pale:rgba(255,180,84,0.16);
    --card:rgba(255,255,255,0.04);
    --card-border:rgba(255,255,255,0.07);
    --glass-blur:blur(22px) saturate(160%);
    --radius:16px;
    --radius-sm:12px;
    --mono: 'Inter', -apple-system, sans-serif;
    --sans: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
    --serif: 'Inter', -apple-system, sans-serif;
    --ink-grad: linear-gradient(135deg, #ffd60a 0%, #ff9f0a 20%, #ff375f 42%, #bf5af2 65%, #64d2ff 85%, #30d158 100%);
  }
  *{box-sizing:border-box;}
  button, input, select, textarea{color:inherit; font-family:inherit;}
  html,body{margin:0;padding:0;}
  body{
    background:#080808;
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 800px 600px at 12% -10%, rgba(248,65,138,0.20), transparent 60%),
      radial-gradient(ellipse 700px 600px at 110% 10%, rgba(163,127,246,0.16), transparent 60%),
      radial-gradient(ellipse 900px 700px at 50% 110%, rgba(255,116,69,0.10), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  .app{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 16px 80px;}

  /* HEADER */
  header.top{
    padding:28px 0 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:40px; height:40px; border-radius:10px;
    background:#181818;
    border:1px solid rgba(255,255,255,0.16);
    flex-shrink:0;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .brand .mark::after{ display:none; }
  .brand h1{
    font-family:var(--sans);
    font-weight:700;
    font-size:18px;
    margin:0;
    letter-spacing:-0.02em;
    background:var(--ink-grad);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
  .brand .tagline{
    font-family:var(--sans); font-size:11px; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:0.08em; margin-top:1px;
  }
  .clock{font-family:var(--mono); font-size:13px; color:var(--ink-faint); text-align:right;}

  /* POINT SWITCHER */
  .points{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .point-btn{
    background:var(--card);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:14px 12px;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:border-color .15s, transform .1s;
    font-family:var(--sans);
    color:var(--ink);
  }
  .point-btn:hover{border-color:var(--line-strong);}
  .point-btn:active{transform:scale(0.99);}
  .point-btn .dot{
    width:8px; height:8px; border-radius:50%;
    display:inline-block; margin-right:6px;
  }
  .point-btn.active{
    border-color:var(--green-deep);
    box-shadow:inset 0 0 0 1px var(--green-deep);
    background:var(--green-pale);
  }
  .point-btn .pname{font-weight:600; font-size:14.5px; display:block; margin-bottom:2px;}
  .point-btn .psub{font-size:11.5px; color:var(--ink-soft);}
  .point-btn .pbalance{
    font-family:var(--mono); font-size:15px; margin-top:8px; display:block;
    font-weight:600;
  }
  .point-btn .pstats{
    margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:4px;
  }
  .point-btn .pstat-row{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .point-btn .pstat-label{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
  .point-btn .pstat-val{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); font-weight:500;}

  /* TABS */
  .tabs{
    display:flex; gap:2px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tab{
    font-family:var(--sans); font-size:13.5px; font-weight:500;
    color:var(--ink-soft);
    padding:10px 14px; border:none; background:none; cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab.active{color:var(--green-deep); border-bottom-color:var(--green-deep);}

  /* CARD */
  .card{
    background:var(--card);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.28);
  }
  .card h2{
    font-family:var(--serif); font-size:18px; font-weight:600; margin:0 0 4px;
  }
  .card .hint{font-size:12.5px; color:var(--ink-faint); margin:0 0 16px;}

  /* FORM */
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px;
    text-transform:uppercase; letter-spacing:0.04em; font-weight:500;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  input[type=date], input[type=number], input[type=text], select{
    width:100%;
    max-width:100%;
    box-sizing:border-box;
    font-family:var(--mono);
    font-size:15px;
    padding:9px 10px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);
    background:rgba(255,255,255,0.05);
    color:var(--ink);
  }
  /* iOS: убираем нативный стиль даты чтобы не выходила за границы */
  input[type=date]{ -webkit-appearance:none; appearance:none; }
  /* Убираем стрелки у числовых полей */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  select{font-family:var(--sans);}
  select option{background:#18181D; color:var(--ink);}
  input:focus, select:focus{outline:2px solid var(--green); outline-offset:1px;}
  .btn{
    font-family:var(--sans); font-size:14px; font-weight:600;
    padding:10px 18px; border-radius:var(--radius-sm);
    border:none;
    background:linear-gradient(135deg, #ffd60a, #ff375f, #bf5af2, #64d2ff); color:#000;
    cursor:pointer;
  }
  .btn:hover{opacity:0.88;}
  .btn.secondary{
    background:var(--green-pale); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    color:var(--green); border:1px solid rgba(61,214,140,0.45);
    box-shadow:0 0 0 1px rgba(61,214,140,0.08), 0 4px 16px rgba(61,214,140,0.10);
  }
  .btn.secondary:hover{border-color:var(--green); color:var(--green); background:rgba(61,214,140,0.22); box-shadow:0 0 0 1px rgba(61,214,140,0.18), 0 6px 20px rgba(61,214,140,0.18);}
  .btn.danger{background:var(--red-pale); color:var(--red); border:1px solid rgba(255,107,107,0.45);}
  .btn.danger:hover{background:rgba(255,107,107,0.22); border-color:var(--red);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}

  .cash-type-btn{
    background:var(--card); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    color:var(--ink-soft); border:1px solid var(--line-strong);
    box-shadow:none;
  }
  .cash-type-btn:hover{color:var(--ink); border-color:var(--line-strong); background:var(--card);}
  .cash-type-btn.active{
    background:var(--green-pale); color:var(--green); border:1px solid rgba(61,214,140,0.45);
    box-shadow:0 0 0 1px rgba(61,214,140,0.08), 0 4px 16px rgba(61,214,140,0.10);
  }
  .cash-type-btn[data-cash-type="withdrawal"].active{
    background:var(--red-pale); color:var(--red); border:1px solid rgba(255,107,107,0.45);
    box-shadow:0 0 0 1px rgba(255,107,107,0.08), 0 4px 16px rgba(255,107,107,0.10);
  }

  /* RECEIPT PREVIEW */
  .receipt{
    background:var(--paper-2);
    border:1px dashed var(--line-strong);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    font-family:var(--mono); font-size:13.5px;
    margin-bottom:14px;
  }
  .receipt .rline{display:flex; justify-content:space-between; padding:3px 0;}
  .receipt .rline.total{border-top:1px dashed var(--line-strong); margin-top:6px; padding-top:8px; font-weight:600;}
  .receipt .rline span:first-child{color:var(--ink-soft);}

  /* METRIC GRID */
  .metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px;}
  .metric{
    background:var(--card); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--card-border); border-radius:var(--radius-sm);
    padding:12px 14px;
  }
  .metric .mlabel{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:4px;}
  .metric .mval{font-family:var(--mono); font-size:19px; font-weight:600;}
  .metric .mval.green{color:var(--green-deep);}
  .metric .mval.red{color:var(--red);}

  /* TABLE */
  table.ledger{width:100%; border-collapse:collapse; font-size:13px;}
  table.ledger th{
    text-align:right; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-soft); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line-strong);
    white-space:nowrap;
  }
  table.ledger th:first-child, table.ledger td:first-child{text-align:left;}
  table.ledger td{
    padding:7px 8px; border-bottom:1px solid var(--line); font-family:var(--mono);
    text-align:right; white-space:nowrap;
  }
  table.ledger tbody tr:hover{background:var(--paper-2);}
  table.ledger td.emp{font-family:var(--sans); text-align:left; color:var(--ink-soft); font-size:12.5px;}
  .tablewrap{overflow-x:auto; margin:0 -4px;}
  .day-cards{display:none;}
  .day-card{
    border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:14px; margin-bottom:10px;
  }
  .day-card:last-child{margin-bottom:0;}
  .dc-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .dc-date{font-family:var(--serif); font-weight:600; font-size:14px;}
  .dc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .dc-item{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .dc-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
  .dc-val{font-family:var(--mono); font-size:13.5px; font-weight:600; text-align:right;}
  .dc-emp{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-soft);}
  .dc-cost-input{width:70px; text-align:right; font-family:var(--mono); font-size:13.5px; font-weight:600; padding:2px 4px; background:transparent; border:none; border-bottom:1px solid var(--line-strong); color:var(--ink); border-radius:0;}
  /* Таблица себестоимости — фиксированная сетка, инпуты на всю ширину ячейки */
  table.cost-table{table-layout:fixed;}
  table.cost-table .cost-inp{
    width:100%; box-sizing:border-box;
    text-align:right; font-family:var(--mono); font-size:13px;
    padding:4px 6px; background:rgba(255,255,255,0.06);
    border:1px solid var(--line-strong); border-radius:6px; color:var(--ink);
  }
  table.cost-table .cost-inp:focus{outline:2px solid var(--green); outline-offset:1px; background:rgba(255,255,255,0.10);}
  table.cost-table td{vertical-align:middle; padding:6px 4px;}
  table.cost-table th{padding:6px 4px;}
  table.cost-table .cost-calc{color:var(--ink-soft); text-align:right; font-family:var(--mono); font-size:13px;}
  .rowdel{cursor:pointer; color:var(--ink-faint); font-size:13px;}
  .rowdel:hover{color:var(--red);}
  .zero{color:var(--ink-faint);}
  .neg{color:var(--red);}

  /* MONTH SWITCHER */
  .month-switch{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .month-chip{
    font-family:var(--sans); font-size:13px; font-weight:500;
    padding:8px 14px; border-radius:30px; border:1px solid var(--line-strong);
    background:var(--card); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    color:var(--ink-soft); cursor:pointer;
    text-transform:capitalize; white-space:nowrap;
  }
  .month-chip:hover{border-color:var(--green-deep); color:var(--ink);}
  .month-chip.active{
    background:var(--green-deep); border-color:var(--green-deep); color:#06160E;
  }
  .month-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 18px;
    background:var(--paper-2); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--card-border); border-radius:var(--radius-sm);
    padding:14px 16px; margin-bottom:16px;
  }
  .month-summary .ms-stat{text-align:left;}
  .month-summary .ms-stat .mss-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:3px;}
  .month-summary .ms-stat .mss-val{font-family:var(--mono); font-size:18px; font-weight:600;}

  /* EMPLOYEES */
  .emp-card{
    border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:14px 16px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .emp-card .ename{font-weight:600; font-size:14.5px;}
  .emp-card .esub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .emp-point-tag{
    font-family:var(--sans); font-size:11.5px; font-weight:500;
    padding:4px 10px; border-radius:20px; cursor:pointer;
    border:1px solid var(--line-strong); background:var(--card);
    color:var(--ink-faint); display:inline-flex; align-items:center; gap:5px;
    transition:all .15s;
  }
  .emp-point-tag .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .emp-point-tag.linked{
    background:var(--green-pale); border-color:rgba(61,214,140,0.45); color:var(--green);
  }
  .emp-point-tag:hover{opacity:0.8;}
  .emp-debt{font-family:var(--mono); font-size:17px; font-weight:600;}
  .emp-debt.owe{color:var(--red);}
  .emp-debt.clear{color:var(--ink-faint);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-faint);}
  .empty-state i{font-size:28px; display:block; margin-bottom:10px;}

  .footnote{font-size:11.5px; color:var(--ink-faint); margin-top:6px; line-height:1.5;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--green-deep); color:#06160E; padding:10px 20px; border-radius:30px;
    font-size:13.5px; font-weight:500; opacity:0; transition:all .25s; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal{
    background:var(--card); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--card-border); border-radius:var(--radius); padding:22px; max-width:380px; width:100%;
    box-shadow:0 16px 48px rgba(0,0,0,0.45);
  }
  .modal h3{font-family:var(--serif); font-size:17px; margin:0 0 10px;}
  .modal p{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 18px;}

  /* PIN LOGIN */
  .pin-dots{display:flex; justify-content:center; gap:22px; margin:10px 0 6px; cursor:text;}
  .pin-dot{
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--line-strong); background:transparent;
    transition:background .12s, border-color .12s, transform .12s;
  }
  .pin-dot.filled{background:var(--green-deep); border-color:var(--green-deep); transform:scale(1.1);}
  .pin-dot.error{background:var(--red); border-color:var(--red);}
  .pin-shake{animation:pin-shake-kf .35s;}
  @keyframes pin-shake-kf{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }

  @media (max-width:600px){
    .app{padding:0 12px 90px;}
    .points{
      grid-template-columns: 1fr;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 10px;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .points::-webkit-scrollbar { display: none; }
    .point-btn {
      scroll-snap-align: center;
      flex: 0 0 85vw;
      max-width: 340px;
    }
    .row2{grid-template-columns:1fr 1fr; gap:10px;}
    .row3{grid-template-columns:1fr 1fr;}
    header.top{flex-direction:column; align-items:flex-start; padding:20px 0 14px;}
    .brand h1{font-size:21px;}
    .card{padding:16px;}
    .tabs{gap:0;}
    .tab{padding:10px 11px; font-size:13px;}
    input[type=date], input[type=number], input[type=text], select{
      font-size:16px; padding:11px 12px; max-width:100%; box-sizing:border-box;
    }
    .btn{padding:12px 18px; font-size:15px;}
    .btn{min-height:44px; display:inline-flex; align-items:center; justify-content:center;}
    .btnrow{gap:8px;}
    .tablewrap{display:none;}
    .day-cards{display:block;}
    .metrics{grid-template-columns:1fr 1fr;}
    .pin-dots{gap:18px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
let POINTS = {};  // заполняется из таблицы points при loadDB

async function sb(path, options={}){
  const res = await fetch(`${SUPABASE_URL}/${path}`, {
    ...options,
    headers:{
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers||{}),
    }
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`PostgREST ${res.status}: ${text}`);
  }
  const ct = res.headers.get('content-type')||'';
  if(ct.includes('application/json')) return res.json();
  return null;
}

const PAID_MARK = 'ОПЛАЧЕНО';

let DB = null;
let state = { point:'yakovleva', tab:'entry', selectedMonth:null };

function fmt(n){
  n = Math.round((n||0)*100)/100;
  if(Object.is(n,-0)) n = 0;
  return n.toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtMoney(n){ return fmt(n) + ' ₽'; }
function dateToLocalStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){
  return dateToLocalStr(new Date());
}
function addDaysStr(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return dateToLocalStr(d);
}
function nextZReport(lastZ){
  if(!lastZ) return '';
  const match = String(lastZ).match(/^(\d+)$/);
  if(!match) return '';
  const digits = match[1];
  const next = String(parseInt(digits,10)+1);
  return next.padStart(digits.length, '0');
}
function weekday(dateStr){
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  const d = new Date(dateStr+'T00:00:00');
  return days[d.getDay()];
}
function fmtDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadDB(){
  const [pointsData, records, payouts, cost, employees, movements, empPoints] = await Promise.all([
    sb('points?select=key,name,sub,color,mode,acquiring&order=sort_order.asc'),
    sb('records?select=point,date,cash,cashless,deduct_pct,staff_pct,employee,z_report&order=date.asc'),
    sb('payouts?select=id,point,employee,date,amount,comment,is_adjustment&order=date.asc'),
    sb('cost_items?select=id,name,price,sheet_cost,ink_cost,staff_pct,pack_cost,pack_qty&order=id.asc'),
    sb('employees?select=id,name,archived&order=name.asc'),
    sb('cash_movements?select=id,point,date,type,amount,comment&order=date.asc'),
    sb('employee_points?select=employee_id,point_key'),
  ]);

  // Пересобираем POINTS из БД
  POINTS = {};
  pointsData.forEach(p=>{
    POINTS[p.key] = {name:p.name, sub:p.sub||'', color:p.color||'#3DD68C', mode:p.mode||'cashier', acquiring:!!p.acquiring};
  });
  // Если state.point больше не существует — переключаемся на первый доступный
  if(!POINTS[state.point]){
    const keys = Object.keys(POINTS);
    state.point = keys.length ? keys[0] : 'default';
  }

  const byPoint = {};
  records.forEach(r=>{
    if(!byPoint[r.point]) byPoint[r.point] = [];
    byPoint[r.point].push([
      r.date, Number(r.cash), Number(r.cashless), r.employee||'',
      r.deduct_pct!=null ? Number(r.deduct_pct) : 0,
      r.staff_pct!=null ? Number(r.staff_pct) : 30,
      r.z_report||'',
    ]);
  });

  const payoutsByPoint = {};
  payouts.forEach(p=>{
    if(!payoutsByPoint[p.point]) payoutsByPoint[p.point] = [];
    payoutsByPoint[p.point].push({
      id:p.id, employee:p.employee, date:p.date, amount:Number(p.amount),
      comment:p.comment||'', isAdjustment:!!p.is_adjustment,
    });
  });

  const movementsByPoint = {};
  movements.forEach(m=>{
    if(!movementsByPoint[m.point]) movementsByPoint[m.point] = [];
    movementsByPoint[m.point].push({id:m.id, date:m.date, type:m.type, amount:Number(m.amount), comment:m.comment||''});
  });

  // Строим карту: employee_id -> Set<point_key>
  const empPointsMap = {};
  empPoints.forEach(ep=>{
    if(!empPointsMap[ep.employee_id]) empPointsMap[ep.employee_id] = new Set();
    empPointsMap[ep.employee_id].add(ep.point_key);
  });

  DB = {
    records: byPoint,
    payouts: payoutsByPoint,
    cost: cost.map(c=>[c.id, c.name, Number(c.price), Number(c.sheet_cost), Number(c.ink_cost), c.staff_pct!=null ? Number(c.staff_pct) : 30, Number(c.pack_cost)||0, Number(c.pack_qty)||1]),
    employees: employees.map(e=>({id:e.id, name:e.name, archived:!!e.archived, points: empPointsMap[e.id] || new Set()})),
    movements: movementsByPoint,
    empPointsMap,
  };
}

function getRows(point){
  return (DB.records[point] || []).slice().sort((a,b)=> a[0]<b[0]?-1:1);
}
function getMovements(point){
  return (DB.movements[point] || []).slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:(a.id-b.id)));
}
function getPayouts(point){
  return (DB.payouts[point] || []).slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:(a.id-b.id)));
}

function buildBalanceTimeline(point){
  const rows = getRows(point);
  const movements = getMovements(point);

  const movementSumByDate = {};
  movements.forEach(m=>{
    if(!movementSumByDate[m.date]) movementSumByDate[m.date] = 0;
    movementSumByDate[m.date] += (m.type==='deposit' ? m.amount : -m.amount);
  });

  const allDates = new Set(rows.map(r=>r[0]));
  movements.forEach(m=> allDates.add(m.date));
  const sortedDates = Array.from(allDates).sort();

  let running = 0;
  const balanceAtDate = {};
  sortedDates.forEach(date=>{
    const row = rows.find(r=>r[0]===date);
    const cash = row ? (row[1]||0) : 0;
    running = running + cash + (movementSumByDate[date]||0);
    balanceAtDate[date] = running;
  });

  return {sortedDates, balanceAtDate, lastBalance: sortedDates.length ? balanceAtDate[sortedDates[sortedDates.length-1]] : 0};
}

function calcBalances(point){
  const rows = getRows(point);
  const {balanceAtDate} = buildBalanceTimeline(point);
  const movements = getMovements(point);

  const depositSumByDate = {};
  const withdrawalSumByDate = {};
  movements.forEach(m=>{
    const map = m.type==='deposit' ? depositSumByDate : withdrawalSumByDate;
    map[m.date] = (map[m.date]||0) + m.amount;
  });

  return rows.map(r=>{
    const [date, cash, cashless, employee, deductPct, staffPct, zReport] = r;
    const total = (cash||0) + (cashless||0);
    const dPct = deductPct!=null ? deductPct : 0;
    const sPct = staffPct!=null ? staffPct : 30;
    const salary = total * (1 - dPct/100) * (sPct/100);
    return {
      date, cash:cash||0, cashless:cashless||0, employee:employee||'', total, balance:balanceAtDate[date], salary,
      deductPct:dPct, staffPct:sPct, zReport:zReport||'',
      deposit: depositSumByDate[date]||0, withdrawal: withdrawalSumByDate[date]||0,
    };
  });
}

function currentBalance(point){
  return buildBalanceTimeline(point).lastBalance;
}

function avgRevenue(point, count){
  const rows = calcBalances(point);
  if(rows.length===0) return 0;
  // rows отсортированы по дате по возрастанию (см. getRows) — берём последние `count` штук
  const lastN = rows.slice(-count);
  const sum = lastN.reduce((s,r)=> s + r.total, 0);
  return sum / lastN.length;
}

function employeeSummary(point){
  const rows = calcBalances(point);
  const payouts = getPayouts(point);
  const archivedNames = new Set((DB.employees||[]).filter(e=>e.archived).map(e=>e.name));
  const isSelfEmployed = POINTS[point].mode === 'selfEmployed';
  const map = {};
  rows.forEach(r=>{
    const name = r.employee.trim();
    if(!name || name===PAID_MARK || archivedNames.has(name)) return;
    if(!map[name]) map[name] = {name, earned:0, shifts:0, lastDate:r.date};
    // На онлайн-кассе вся выручка у нас, и мы должны сотруднику его долю (r.salary).
    // На самозанятости вся выручка уже у сотрудника на руках, и он должен вернуть
    // нам нашу часть — то, что остаётся после вычета его доли (total - r.salary).
    map[name].earned += isSelfEmployed ? (r.total - r.salary) : r.salary;
    map[name].shifts += 1;
    if(r.date > map[name].lastDate) map[name].lastDate = r.date;
  });
  payouts.forEach(p=>{
    const {employee:name, date, amount} = p;
    if(archivedNames.has(name)) return;
    if(!map[name]) map[name] = {name, earned:0, shifts:0, lastDate:date};
    map[name].paid = (map[name].paid||0) + amount;
  });
  return Object.values(map).map(e=>{
    e.paid = e.paid || 0;
    e.balance = e.earned - e.paid;
    e.avgPerShift = e.shifts ? e.earned/e.shifts : 0;
    return e;
  }).sort((a,b)=> b.balance - a.balance);
}

    html += `

        <span class="pname"><span class="dot" style="background:${p.color}"></span>${p.name}</span>

        </div>
        ${m.comment ? `<div class="dc-emp">${m.comment}</div>` : ''}

  return html;
}

function updateLivePreview(){
  const cash = parseFloat(document.getElementById('f-cash').value) || 0;
  const cashless = parseFloat(document.getElementById('f-cashless').value) || 0;
  const total = cash + cashless;
  const point = state.point;
  const deductPct = parseFloat(document.getElementById('f-deduct-pct').value) || 0;
  const staffPct = parseFloat(document.getElementById('f-staff-pct').value) || 0;
  const salary = total * (1 - deductPct/100) * (staffPct/100);
  const empSelected = document.getElementById('f-employee').value;
  const isPaid = empSelected === PAID_MARK;

  const dateVal = document.getElementById('f-date').value;
  const {sortedDates, balanceAtDate} = buildBalanceTimeline(point);
  const priorDates = sortedDates.filter(d=> d < dateVal);
  const prevBalance = priorDates.length ? balanceAtDate[priorDates[priorDates.length-1]] : 0;
  const newBalance = cash + prevBalance;

  const salaryLine = isPaid
    ? `<div class="rline"><span>Доля сотрудника</span><span>${fmtMoney(salary)} — выдана сразу, в долг не идёт</span></div>`
    : `<div class="rline"><span>ЗП сотрудника</span><span>${fmtMoney(salary)}</span></div>`;

  const base = total * (1 - deductPct/100);
  const formulaLine = `<div class="rline"><span>База после вычета ${fmt(deductPct)}%</span><span>${fmtMoney(base)}</span></div>`;

  document.getElementById('livePreview').innerHTML = `
    <div class="rline"><span>Продажи общая</span><span>${fmtMoney(total)}</span></div>
    ${formulaLine}
    ${salaryLine}
    <div class="rline total"><span>Остаток в кассе после</span><span>${fmtMoney(newBalance)}</span></div>
  `;
}

const MONTH_NAMES = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function renderHistory(){
  const point = state.point;
  const rows = calcBalances(point);
  if(rows.length===0){
    return `<div class="card"><div class="empty-state"><i class="ti ti-database-off"></i>Пока нет записей для этой точки</div></div>`;
  }

  const groups = {};
  rows.forEach(r=>{
    const key = r.date.slice(0,7);
    if(!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  const monthKeys = Object.keys(groups).sort().reverse();

  if(!state.selectedMonth || !groups[state.selectedMonth]){
    state.selectedMonth = monthKeys[0];
  }
  const activeKey = state.selectedMonth;
  const monthRows = groups[activeKey].slice().reverse();
  const [y, m] = activeKey.split('-').map(Number);
  const monthLabel = `${MONTH_NAMES[m-1]} ${y}`;
  const sumCash = monthRows.reduce((s,r)=>s+r.cash,0);
  const sumCashless = monthRows.reduce((s,r)=>s+r.cashless,0);
  const sumTotal = sumCash + sumCashless;

  let html = `<div class="card" style="margin-bottom:14px;">
    <h2>История по дням</h2>
    <p class="hint">${POINTS[point].name} — всего ${rows.length} записей за ${monthKeys.length} ${monthKeys.length===1?'месяц':'месяцев'}</p>
  </div>`;

  html += `<div class="month-switch">`;
  monthKeys.forEach(key=>{
    const [yy, mm] = key.split('-').map(Number);
    const label = `${MONTH_NAMES[mm-1].slice(0,3)} ${yy}`;
    html += `<button class="month-chip ${key===activeKey?'active':''}" data-month-select="${key}">${label}</button>`;
  });
  html += `</div>`;

  html += `<div class="month-summary">
    <div class="ms-stat"><div class="mss-label">Нал за ${monthLabel}</div><div class="mss-val">${fmtMoney(sumCash)}</div></div>
    <div class="ms-stat"><div class="mss-label">Безнал за ${monthLabel}</div><div class="mss-val">${fmtMoney(sumCashless)}</div></div>
    <div class="ms-stat"><div class="mss-label">Итого</div><div class="mss-val" style="color:var(--green-deep)">${fmtMoney(sumTotal)}</div></div>
    <div class="ms-stat"><div class="mss-label">Дней с продажами</div><div class="mss-val">${monthRows.length}</div></div>
  </div>`;

  html += `<div class="card"><div class="tablewrap">
    <table class="ledger">
      <thead><tr>
        <th>Дата</th><th>Z-отчёт</th><th>Нал</th><th>Безнал</th><th>Итого</th><th>Внес.</th><th>Изъят.</th><th>Остаток</th><th>ЗП</th><th>Сотрудник</th><th></th>
      </tr></thead>
      <tbody>`;
  monthRows.forEach(r=>{
    html += `<tr data-date="${r.date}">
      <td>${weekday(r.date)} ${fmtDate(r.date)}</td>
      <td class="${r.zReport?'':'zero'}">${r.zReport||'—'}</td>
      <td class="${r.cash?'':'zero'}">${fmt(r.cash)}</td>
      <td class="${r.cashless?'':'zero'}">${fmt(r.cashless)}</td>
      <td>${fmt(r.total)}</td>
      <td class="${r.deposit?'':'zero'}">${r.deposit?fmt(r.deposit):'—'}</td>
      <td class="${r.withdrawal?'':'zero'}">${r.withdrawal?fmt(r.withdrawal):'—'}</td>
      <td>${fmt(r.balance)}</td>
      <td title="вычет ${fmt(r.deductPct)}% · доля ${fmt(r.staffPct)}%">${fmt(r.salary)}</td>
      <td class="emp">${r.employee===PAID_MARK ? `<span style="color:var(--green-deep); font-weight:500;">${PAID_MARK}</span>` : (r.employee||'—')}</td>
      <td><span class="rowdel" data-del="${r.date}" title="Удалить запись"><i class="ti ti-trash"></i></span></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  html += `<div class="day-cards">`;
  monthRows.forEach(r=>{
    html += `<div class="day-card" data-date="${r.date}">
      <div class="dc-top">
        <div class="dc-date">${weekday(r.date)} ${fmtDate(r.date)}</div>
        <span class="rowdel" data-del="${r.date}" title="Удалить запись"><i class="ti ti-trash"></i></span>
      </div>
      <div class="dc-grid">
        <div class="dc-item"><div class="dc-label">Нал</div><div class="dc-val ${r.cash?'':'zero'}">${fmt(r.cash)}</div></div>
        <div class="dc-item"><div class="dc-label">Безнал</div><div class="dc-val ${r.cashless?'':'zero'}">${fmt(r.cashless)}</div></div>
        <div class="dc-item"><div class="dc-label">Итого</div><div class="dc-val">${fmt(r.total)}</div></div>
        <div class="dc-item"><div class="dc-label">Внесение</div><div class="dc-val ${r.deposit?'':'zero'}">${r.deposit?fmt(r.deposit):'—'}</div></div>
        <div class="dc-item"><div class="dc-label">Изъятие</div><div class="dc-val ${r.withdrawal?'':'zero'}">${r.withdrawal?fmt(r.withdrawal):'—'}</div></div>

function attachHandlers(){
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', ()=>{
      sessionStorage.removeItem(AUTH_KEY);
      renderLogin();
    });
  }
  document.getElementById('managePointsBtn')?.addEventListener('click', openManagePointsModal);
  document.querySelectorAll('[data-point]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.point = btn.dataset.point;
      state.selectedMonth = null;
      render();
    });
  });
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.tab = btn.dataset.tab;
      render();
    });
  });

  if(state.tab==='entry'){
    const empSelect = document.getElementById('f-employee');
    const empNew = document.getElementById('f-employee-new');
    empSelect.addEventListener('change', ()=>{
      empNew.style.display = empSelect.value==='__new__' ? 'block' : 'none';
      updateLivePreview();
    });
    ['f-cash','f-cashless','f-date','f-deduct-pct','f-staff-pct'].forEach(id=>{
      document.getElementById(id).addEventListener('input', updateLivePreview);
    });
    updateLivePreview();
    document.getElementById('saveDayBtn').addEventListener('click', saveDay);
  }

  if(state.tab==='cash'){
    document.querySelectorAll('.cash-type-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.cash-type-btn').forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    document.getElementById('saveCashBtn').addEventListener('click', saveCashMovement);
    document.querySelectorAll('[data-del-movement]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        confirmDeleteMovement(el.dataset.delMovement);
      });
    });
  }

  if(state.tab==='history'){
    document.querySelectorAll('[data-month-select]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.selectedMonth = el.dataset.monthSelect;
        render();
      });
    });
    document.querySelectorAll('[data-del]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        confirmDelete(el.dataset.del);
      });
    });
  }

  if(state.tab==='staff'){
    const addBtn = document.getElementById('addEmpBtn');
    const addInput = document.getElementById('newEmpName');
    if(addBtn){
      addBtn.addEventListener('click', ()=> addEmployee(addInput.value));
      addInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addEmployee(addInput.value); });
    }
    document.querySelectorAll('[data-archive-emp]').forEach(btn=>{
      btn.addEventListener('click', ()=> setEmployeeArchived(btn.dataset.archiveEmp, true));
    });
    document.querySelectorAll('[data-unarchive-emp]').forEach(btn=>{
      btn.addEventListener('click', ()=> setEmployeeArchived(btn.dataset.unarchiveEmp, false));
    });
    document.querySelectorAll('[data-link-emp]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const empId = btn.dataset.linkEmp;
        const pointKey = btn.dataset.linkPoint;
        const linked = btn.dataset.linked === 'true';
        try{
          if(linked){
            await sb(`employee_points?employee_id=eq.${empId}&point_key=eq.${pointKey}`, {method:'DELETE', prefer:'return=minimal'});
          }else{
            await sb('employee_points', {method:'POST', body:JSON.stringify({employee_id:Number(empId), point_key:pointKey}), prefer:'return=minimal'});
          }
          await loadDB();
          render();
        }catch(e){
          console.error(e);
          showToast('Не удалось изменить привязку');
        }
      });
    });
  }

  if(state.tab==='payroll'){
    document.querySelectorAll('[data-payout-open]').forEach(btn=>{
      btn.addEventListener('click', ()=> openPayoutModal(btn.dataset.payoutOpen, parseFloat(btn.dataset.amount)));
    });
    document.querySelectorAll('[data-adjust-open]').forEach(btn=>{
      btn.addEventListener('click', ()=> openAdjustmentModal(btn.dataset.adjustOpen, parseFloat(btn.dataset.balance)));
    });
    document.querySelectorAll('[data-del-payout]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        confirmDeletePayout(el.dataset.delPayout);
      });
    });
  }

  if(state.tab==='cost'){
    document.querySelectorAll('[data-cost-id][data-cost-field]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const id = inp.dataset.costId;
        const field = inp.dataset.costField;
        const val = parseFloat(inp.value)||0;
        try{
          await sb(`cost_items?id=eq.${id}`, {method:'PATCH', body:JSON.stringify({[field]:val}), prefer:'return=minimal'});
          await loadDB();
          showToast('Сохранено');
          render();
        }catch(e){
          console.error(e);
          showToast('Не удалось сохранить');
        }
      });
    });
    document.getElementById('addCostItemBtn')?.addEventListener('click', openAddCostItemModal);
  }
}

const AUTO_WITHDRAWAL_COMMENT = 'авто: выручка у сотрудника на руках (самозанятость)';

async function saveDay(){
  const point = state.point;
  const date = document.getElementById('f-date').value;
  if(!date){ showToast('Укажите дату'); return; }
  const cash = parseFloat(document.getElementById('f-cash').value) || 0;
  const cashless = parseFloat(document.getElementById('f-cashless').value) || 0;
  const deductPct = parseFloat(document.getElementById('f-deduct-pct').value) || 0;
  const staffPct = parseFloat(document.getElementById('f-staff-pct').value) || 0;
  const zReport = document.getElementById('f-zreport').value.trim();
  let employee = document.getElementById('f-employee').value;
  let isNewEmployee = false;
  if(employee==='__new__'){
    employee = document.getElementById('f-employee-new').value.trim();
    isNewEmployee = true;
  }
  if(!employee){ showToast('Выберите сотрудника'); return; }

  const btn = document.getElementById('saveDayBtn');
  btn.disabled = true;
  try{
    if(isNewEmployee){
      await sb('employees?on_conflict=name', {
        method:'POST',
        body: JSON.stringify({name:employee, archived:false}),
        prefer: 'resolution=merge-duplicates,return=minimal',
      });
    }
    await sb('records?on_conflict=point,date', {
      method:'POST',
      body: JSON.stringify({point, date, cash, cashless, employee, deduct_pct:deductPct, staff_pct:staffPct, z_report:zReport}),
      prefer: 'resolution=merge-duplicates,return=minimal',
    });

    if(POINTS[point].mode === 'selfEmployed'){
      // Убираем прежнее авто-изъятие за эту дату (если день редактировался повторно),
      // чтобы не плодить дубли, и создаём новое на актуальную сумму нал.
      await sb(`cash_movements?point=eq.${point}&date=eq.${date}&type=eq.withdrawal&comment=eq.${encodeURIComponent(AUTO_WITHDRAWAL_COMMENT)}`, {
        method:'DELETE', prefer:'return=minimal',
      });
      if(cash > 0){
        await sb('cash_movements', {
          method:'POST',
          body: JSON.stringify({point, date, type:'withdrawal', amount:cash, comment:AUTO_WITHDRAWAL_COMMENT}),
          prefer: 'return=minimal',
        });
      }
    }

    await loadDB();
    showToast('День сохранён');
    render();
  }catch(e){
    console.error(e);
    showToast('Не удалось сохранить — проверьте связь');
    btn.disabled = false;
  }
}

          <label>Цвет маркера</label>
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;">
            ${['#3DD68C','#FFB454','#FF6B6B','#60B0FF','#C07EFF','#FF82C3','#FFD966','#7EC8C8'].map(c=>
              `<button class="point-color-pick" data-color="${c}" style="width:28px;height:28px;border-radius:50%;background:${c};border:2px solid transparent;cursor:pointer;flex-shrink:0;"></button>`
            ).join('')}
          </div>
          <input type="hidden" id="newPointColor" value="#60B0FF">
        </div>
        <div class="btnrow" style="margin-top:14px;">
          <button class="btn" id="confirmAddPointBtn">Добавить пункт</button>
          <button class="btn secondary" id="cancelManagePointsBtn">Закрыть</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

    if(btn.dataset.color === selectedColor) btn.style.borderColor = 'var(--ink)';
    btn.addEventListener('click', ()=>{
      overlay.querySelectorAll('.point-color-pick').forEach(b=> b.style.borderColor = 'transparent');
      btn.style.borderColor = 'var(--ink)';
      selectedColor = btn.dataset.color;
      document.getElementById('newPointColor').value = selectedColor;
    });
  });

  // Удаление пункта
  overlay.querySelectorAll('[data-del-point]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.delPoint;
      const p = POINTS[key];
      if(!confirm(`Удалить пункт «${p.name}»?\n\nВсе данные (записи, выплаты, движения кассы) останутся в базе, но пункт исчезнет из интерфейса.`)) return;

        showToast(`Пункт «${p.name}» удалён`);
        document.body.removeChild(overlay);
        render();

    const sortOrder = Object.keys(POINTS).length + 1;
    try{

      showToast(`Пункт «${name}» добавлен`);

      render();
    }catch(e){
      console.error(e);
      showToast('Не удалось добавить пункт');
    }
  });

  document.getElementById('cancelManagePointsBtn').addEventListener('click', ()=>{
    document.body.removeChild(overlay);
  });
}

  }catch(e){
    console.error(e);
    showToast('Не удалось изменить статус сотрудника');
  }
}

let pinValue = '';

function renderLogin(){
  const pinLength = APP_PASSWORD.length;
  pinValue = '';
  document.getElementById('app').innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
      <div class="card" style="max-width:340px; width:100%; text-align:center;">
        <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:28px; gap:16px;">
          <div style="width:64px; height:64px; border-radius:16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <span style="font-size:26px; font-weight:700; background:var(--ink-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-0.03em;">ПП</span>
          </div>
          <div style="text-align:center;">
            <h1 style="font-size:22px; margin:0 0 4px; font-weight:700; background:var(--ink-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Пункт Печати</h1>
            <div class="tagline" style="text-align:center;">учёт касс</div>
          </div>
        </div>
        <p class="hint" style="margin-bottom:0;">Введите пин-код для входа</p>
        <div class="pin-dots" id="pinDots"></div>
        <input type="tel" inputmode="numeric" autocomplete="off" id="pinInput" maxlength="${pinLength}"
          style="position:absolute; opacity:0; width:1px; height:1px; pointer-events:none;">
      </div>
    </div>
  `;

  const dotsEl = document.getElementById('pinDots');
  const hiddenInput = document.getElementById('pinInput');
  const renderDots = (errorState)=>{
    let html = '';
    for(let i=0;i<pinLength;i++){
      const filled = i < pinValue.length;
      html += `<span class="pin-dot ${filled?'filled':''} ${errorState?'error':''}"></span>`;
    }
    dotsEl.innerHTML = html;
  };
  renderDots(false);

  const tryLogin = ()=>{
    if(pinValue === APP_PASSWORD){
      sessionStorage.setItem(AUTH_KEY, '1');
      boot();
    }else{
      renderDots(true);
      document.querySelector('.card').classList.add('pin-shake');
      setTimeout(()=>{
        pinValue = '';
        hiddenInput.value = '';
        renderDots(false);
        document.querySelector('.card')?.classList.remove('pin-shake');
      }, 380);
    }
  };

  hiddenInput.addEventListener('input', ()=>{
    pinValue = hiddenInput.value.replace(/\D/g,'').slice(0, pinLength);
    hiddenInput.value = pinValue;
    renderDots(false);
    if(pinValue.length === pinLength) setTimeout(tryLogin, 120);
  });

  document.querySelector('.card').addEventListener('click', ()=> hiddenInput.focus());
  hiddenInput.focus();
  // На мобильном — автофокус сразу, чтобы вылезала клавиатура
  // На десктопе тоже фокусируем, но без клавиатуры это безопасно
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(isMobile){
    // Небольшая задержка нужна чтобы iOS успел отрисовать DOM перед focus()
    setTimeout(()=> hiddenInput.focus(), 120);
  } else {
    hiddenInput.focus();
  }
}

function renderLoadError(message){
  document.getElementById('app').innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
      <div class="card" style="max-width:380px; width:100%; text-align:center;">
        <i class="ti ti-database-off" style="font-size:28px; color:var(--ink-faint); display:block; margin-bottom:10px;"></i>
        <h2>Не удалось загрузить данные</h2>
        <p class="hint">${message}</p>
        <div class="btnrow" style="justify-content:center;">
          <button class="btn secondary" id="retryBtn">Повторить</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', boot);
}

async function boot(){
  document.getElementById('app').innerHTML = `<div style="padding:60px 0; text-align:center; color:var(--ink-faint);">Загрузка…</div>`;
  try{
    await loadDB();
    render();
  }catch(e){
    console.error(e);
    renderLoadError('Проверьте подключение к интернету и повторите попытку.');
  }
}

(function init(){
  if(sessionStorage.getItem(AUTH_KEY) === '1'){
    boot();
  }else{
    renderLogin();
  }
})();
</script>
</body>
</html>
